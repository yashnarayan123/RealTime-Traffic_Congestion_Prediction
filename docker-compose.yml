services:
  kafka:
    image: apache/kafka:4.1.0
    container_name: traffic-kafka

    ports:
      - "9094:9094"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 3

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s


  spark-master:
    image: traffic-spark:4.0.1-kafka
    container_name: traffic-spark-master

    command:
      [
        "/opt/spark/bin/spark-class",
        "org.apache.spark.deploy.master.Master",
        "--host",
        "spark-master"
      ]

    ports:
      - "8080:8080"
      - "7077:7077"

    volumes:
      - ./:/opt/traffic
      - ./data/processed:/opt/traffic/data/processed

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: traffic-events
      TRAFFIC_PARQUET_PATH: /opt/traffic/data/processed/traffic_summary
      TRAFFIC_CHECKPOINT_PATH: /tmp/traffic-parquet-checkpoint-fixed

    depends_on:
      kafka:
        condition: service_healthy

    restart: unless-stopped


  spark-worker:
    image: traffic-spark:4.0.1-kafka
    container_name: traffic-spark-worker

    command:
      [
        "/opt/spark/bin/spark-class",
        "org.apache.spark.deploy.worker.Worker",
        "--cores",
        "2",
        "--memory",
        "1g",
        "spark://spark-master:7077"
      ]

    depends_on:
      spark-master:
        condition: service_started

    ports:
      - "8081:8081"

    volumes:
      - ./:/opt/traffic
      - ./data/processed:/opt/traffic/data/processed

    restart: unless-stopped


volumes:
  kafka_data: